# Netlify build config. The Next.js runtime turns the API routes into serverless
# functions, so GOAL_API_KEY stays server-side (set it in Netlify env vars).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # GOAL_API_BASE is a public URL, so exempt it from secrets scanning (it appears
  # in code as the default). The scan stays on for GOAL_API_KEY.
  SECRETS_SCAN_OMIT_KEYS = "GOAL_API_BASE"

[[plugins]]
  package = "@netlify/plugin-nextjs"
